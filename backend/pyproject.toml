[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tia-julia-backend"
version = "1.0.0"
description = "Tía Julia — Ventas, Órdenes, Inventario y Analítica para juguería familiar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "reportlab>=4.2",
    "matplotlib>=3.9",
    "python-dateutil>=2.9",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
